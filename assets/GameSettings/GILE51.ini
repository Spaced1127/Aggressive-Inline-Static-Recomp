# GILE51 - Aggressive Inline (USA), static recomp settings.
# Shipped into Sys/GameSettings/ by tools/make_release_gile.ps1. The base
# Sys/GameSettings/GIL.ini still applies; these keys are layered on top.
# Measurements: docs/notes/14-movielot-stutter.md

[Core]
# SDK SelectThread idle loop (`while (RunQueueBits == 0) {}` between
# OSEnableInterrupts 0x80140944 and OSDisableInterrupts 0x80140930). The
# static core idle-skips only at this PC; without it the loop spins on the
# host while the game waits on disc/DSP and Movie Lot drops to ~54 FPS
# (speed 0.92). With it Movie Lot holds 60 FPS at speed 1.00.
StaticRecompIdlePC = 0x80143348
# Treat disc reads as buffered. Removes the 1.3-1.6 s level-load freezes and
# the 6-VI (100 ms) frame staircase while Movie Lot streams its data.
FastDiscSpeed = True
